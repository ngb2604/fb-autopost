name: Worker đăng bài

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam. GitHub cron có thể trễ vài phút.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ chạy thử (không gọi Facebook)"
        type: boolean
        default: false

# Không bao giờ chạy chồng hai lần
concurrency:
  group: fb-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt pytest

      - name: Chạy unit test
        run: python -m pytest worker/tests -q

      - name: Chạy worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_MODEL_FALLBACKS: ${{ vars.GEMINI_MODEL_FALLBACKS || 'gemini-3.5-flash-lite,gemini-3.8-flash' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_GRAPH_VERSION: ${{ vars.FB_GRAPH_VERSION || 'v26.0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PHOTOS_PER_RUN: ${{ vars.MAX_PHOTOS_PER_RUN || '5' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m worker.main --dry-run
          else
            python -m worker.main
          fi

      - name: Báo lỗi qua Telegram nếu job thất bại
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🚨 Worker (GitHub Actions) thất bại. Mở Actions để xem log." \
            > /dev/null || true
