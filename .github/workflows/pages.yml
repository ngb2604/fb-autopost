name: Deploy PWA lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Kiểm tra không có secret trong web/
        run: |
          if grep -rIl --exclude="config.example.js" -E "SERVICE_ROLE|GEMINI_API_KEY|FB_PAGE_ACCESS_TOKEN|TELEGRAM_BOT_TOKEN|EAA[A-Za-z0-9]{20,}" web/; then
            echo "::error::Phát hiện secret trong thư mục web/ — dừng deploy."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
